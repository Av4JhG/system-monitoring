version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - depguard
    - dogsled
    - dupl
    - durationcheck
    - errorlint
    - exhaustive
    - funlen
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goheader
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - govet
    - importas
    - ineffassign
    - lll
    - makezero
    - misspell
    - nestif
    - nilerr
    # - noctx
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tagliatelle
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - wastedassign
    - whitespace
  settings:
    funlen:
      lines: 150
      statements: 80
    gosec:
      excludes:
        - G115
    exhaustive:
      default-signifies-exhaustive: true
    depguard:
      rules:
        main:
          allow:
            - bufio
            - context
            - errors
            - flag
            - fmt
            - io
            - log
            - math/rand
            - net
            - os
            - os/exec
            - os/signal
            - path/filepath
            - strconv
            - strings
            - syscall
            - sync
            - time
            - github.com/spf13/viper
            - gopkg.in/natefinch/lumberjack.v2
            - google.golang.org/grpc
            - google.golang.org/grpc/credentials/insecure
            - google.golang.org/grpc/codes
            - google.golang.org/grpc/status
            - github.com/benbjohnson/clock
            - google.golang.org/protobuf/types/known/timestamppb
            - github.com/Av4JhG/system-monitoring/internal/core
            - github.com/Av4JhG/system-monitoring/internal/collector
            - github.com/Av4JhG/system-monitoring/internal/cpu
            - github.com/Av4JhG/system-monitoring/internal/clients
            - github.com/Av4JhG/system-monitoring/internal/grpc
            - github.com/Av4JhG/system-monitoring/internal/load_avg
            - github.com/Av4JhG/system-monitoring/internal/load_disks
            - github.com/Av4JhG/system-monitoring/internal/logger
            - github.com/Av4JhG/system-monitoring/pb
            - github.com/Av4JhG/system-monitoring/internal/sm
            - github.com/Av4JhG/system-monitoring/config
            - github.com/Av4JhG/system-monitoring/internal/used_fs
            
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
